spring.application.name=jarvis
server.port=8080

# ---------- Logging (Logback) ----------
# 日志落盘目录（logback-spring.xml 通过 <springProperty> 读取该值）
logging.file.path=${user.dir}/log
logging.level.root=INFO
logging.level.com.example.jarvis=INFO
# MyBatis Mapper SQL 输出到文件（DEBUG 级别才打印 SQL）
logging.level.com.example.jarvis.mapper=DEBUG

# H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# H2 datasource (in-memory)
spring.datasource.url=jdbc:h2:mem:jarvisdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# SQL init (create schema on startup)
spring.sql.init.mode=always

# MyBatis
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.example.jarvis.model
mybatis.configuration.map-underscore-to-camel-case=true
# 使用 SLF4J 桥接输出，以便 SQL 日志也进入 logback 配置的文件
mybatis.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl

# AgentScope (OpenAI-compatible endpoint; override via env vars)
agentscope.model.api-key=${AGENTSCOPE_API_KEY:sk-demo-key}
agentscope.model.base-url=${AGENTSCOPE_BASE_URL:https://api.openai.com/v1}
agentscope.model.name=${AGENTSCOPE_MODEL:gpt-4o-mini}
agentscope.agent.name=jarvis-assistant
agentscope.agent.sys-prompt=You are JARVIS, a helpful assistant. Use the available tools to answer questions about tasks.
agentscope.agent.max-iters=10
