spring.application.name=jarvis
server.port=8080

# ---------- Logging (Logback) ----------
# 日志落盘目录（logback-spring.xml 通过 <springProperty> 读取该值）
logging.file.path=${user.dir}/log
logging.level.root=INFO
logging.level.com.example.jarvis=INFO
# MyBatis Mapper SQL 输出到文件（DEBUG 级别才打印 SQL）
logging.level.com.example.jarvis.mapper=DEBUG

# ---------- Datasource (MySQL) ----------
# 本地默认连接 127.0.0.1:3306 的 jarvis 库；全部可用环境变量覆盖
# Docker 部署时由 compose 注入：MYSQL_URL=jdbc:mysql://mysql:3306/jarvis...
spring.datasource.url=${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/jarvis?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_USERNAME:jarvis}
spring.datasource.password=${MYSQL_PASSWORD:jarvis123}

# SQL init (create schema on startup; schema.sql 为 MySQL 方言、幂等建表)
spring.sql.init.mode=always

# MyBatis
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.example.jarvis.model
mybatis.configuration.map-underscore-to-camel-case=true
# 使用 SLF4J 桥接输出，以便 SQL 日志也进入 logback 配置的文件
mybatis.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl

# AgentScope (OpenAI-compatible endpoint; override via env vars)
agentscope.model.api-key=${AGENTSCOPE_API_KEY:sk-demo-key}
agentscope.model.base-url=${AGENTSCOPE_BASE_URL:https://api.openai.com/v1}
agentscope.model.name=${AGENTSCOPE_MODEL:gpt-4o-mini}
agentscope.agent.name=${AGENTSCOPE_AGENT_NAME:jarvis-assistant}
agentscope.agent.sys-prompt=${AGENTSCOPE_AGENT_SYS_PROMPT:You are JARVIS, a helpful assistant. Use the available tools to answer questions about tasks.}
agentscope.agent.max-iters=${AGENTSCOPE_AGENT_MAX_ITERS:10}

# ---------- RAG 知识库（检索核心 + Ollama 向量化） ----------
# 前提：本机运行 ollama serve，并已 ollama pull bge-m3
rag.embedding.base-url=${RAG_EMBEDDING_BASE_URL:http://127.0.0.1:11434}
rag.embedding.model=${RAG_EMBEDDING_MODEL:bge-m3}
# 超时需覆盖模型冷加载耗时（空闲卸载后的首次请求）；keep_alive 让模型常驻内存
rag.embedding.timeout-seconds=${RAG_EMBEDDING_TIMEOUT_SECONDS:120}
rag.embedding.keep-alive=${RAG_EMBEDDING_KEEP_ALIVE:60m}
# 单次 HTTP 请求最大输入条数：CPU 推理约 6s/条，大批次会撞超时墙
rag.embedding.batch-size=${RAG_EMBEDDING_BATCH_SIZE:4}
# 分块：标题感知 + 面包屑前缀 + 相邻块重叠；块越小语义越聚焦，检索区分度越高
rag.chunk.max-chars=${RAG_CHUNK_MAX_CHARS:500}
rag.chunk.hard-limit=${RAG_CHUNK_HARD_LIMIT:800}
rag.chunk.overlap-chars=${RAG_CHUNK_OVERLAP_CHARS:80}
# 混合检索：0.75*向量cosine + 0.25*词面重合；min-score 仅用于对话注入过滤，搜索接口不截断
rag.retrieval.top-k=${RAG_TOP_K:4}
rag.retrieval.min-score=${RAG_MIN_SCORE:0.40}
rag.retrieval.inject-score=${RAG_INJECT_SCORE:0.50}

